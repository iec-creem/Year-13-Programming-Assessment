<!-- Page extends to template.html -->
{% extends 'template.html' %} {% block title %} Sign Up {% endblock %}
<!-- Sign up page content -->
{% block content %}

<!-- Start of form -->
<div class="container px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
        <div class="col-lg-8 col-xl-6 text-center">
            <h2 class="mt-3">Sign Up</h2>
        </div>
    </div>
    <div class="row gx-4 gx-lg-5 justify-content-center mb-5">
        <div class="col-lg-6">
            <form method ="POST">
                <div class="form-group">
                    <div class="mb-3">
                        <!-- Email form -->
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Enter Email Address" />
                    </div>

                    <div class="mb-3">            
                        <!-- Username form -->
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="Enter Your Username" />
                    </div>

                    <div class="mb-3">    
                        <!-- Password 1 form -->
                        <label for="password1">Password</label>
                        <input type="password" id="password1" name="password1" class="form-control" placeholder="Enter Your Password" />
                        <div id="passwordHelpBlock" class="form-text">
                            Your password must be 8-20 characters long
                        </div>
                    </div>

                    <div class="mb-3">    
                        <!-- Password 2 form -->
                        <label for="password2">Password</label>
                        <input type="password" id="password2" name="password2" class="form-control" placeholder="Confirm Password" />
                        <br />
                    </div>

                    <div align="center">
                        <button class="btn btn-light" type="submit">Sign Up</button>
                    </div>
                    <br/>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
