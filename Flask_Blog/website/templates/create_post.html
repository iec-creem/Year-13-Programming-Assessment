<!-- Page extends to template.html -->
{% extends "template.html"%} {% block title %} Post {% endblock %}
<!-- Blog page content -->
{% block content %}

<!-- Start of Form -->
<div class="container px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
        <div class="col-lg-8 col-xl-6 text-center">
            <h2 class="mt-3">Make a Post</h2>
        </div>
    </div>
    <div class="row gx-4 gx-lg-5 justify-content-center mb-5">
        <div class="col-lg-6">
            <form method ="POST">
                <div class="form-group">
                    <div class="mb-3"> 
                        <!-- Blog title form -->
                        <label for="title">Post Title</label>
                        <input type="text" id="title" name="title" class="form-control" placeholder="Blog Title" />
                    </div>

                    <div class="mb-3"> 
                        <!-- Blog content text area -->
                        <label for="title">Post Content</label>
                        <textarea name="content" id="content" class="form-control"></textarea>
                        <br />
                    </div>

                    <div align="center">
                        <button class="btn btn-primary" type="submit">Create Post</button>
                    </div>
                    <br/>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
